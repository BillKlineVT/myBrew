{{- $component := "sensor-service" }}
{{- $svc := .Values.sensorService }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mybrew.fullname" . }}-{{ $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mybrew.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ include "mybrew.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ .Values.image.registry }}/{{ $svc.image.repository }}:{{ include "mybrew.imageTag" (dict "serviceTag" $svc.image.tag "globalTag" .Values.image.tag) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: MOCK_HARDWARE
              value: {{ $svc.mockHardware | quote }}
            - name: DATA_SERVICE_URL
              value: "http://{{ include "mybrew.fullname" . }}-data-service:8001"
            - name: REDIS_URL
              value: {{ include "mybrew.redisUrl" . | quote }}
            - name: POLL_INTERVAL_S
              value: {{ $svc.pollIntervalSeconds | quote }}
            - name: HLT_SENSOR_ID
              value: {{ $svc.hltSensorId | quote }}
            - name: MASH_SENSOR_ID
              value: {{ $svc.mashSensorId | quote }}
            - name: BOIL_SENSOR_ID
              value: {{ $svc.boilSensorId | quote }}
            - name: SERIAL_PORT
              value: {{ $svc.serialPort | quote }}
          {{- if not $svc.mockHardware }}
          # Real RPi hardware: mount 1-wire sysfs and serial device
          volumeMounts:
            - name: w1-devices
              mountPath: /sys/bus/w1/devices
              readOnly: true
            - name: serial-dev
              mountPath: {{ $svc.serialPort }}
          securityContext:
            privileged: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      {{- if not $svc.mockHardware }}
      volumes:
        - name: w1-devices
          hostPath:
            path: /sys/bus/w1/devices
            type: Directory
        - name: serial-dev
          hostPath:
            path: {{ $svc.serialPort }}
            type: CharDevice
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mybrew.fullname" . }}-{{ $component }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mybrew.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $svc.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
      protocol: TCP
