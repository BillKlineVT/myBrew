{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mybrew.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mybrew.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .service "frontend" }}
                name: {{ include "mybrew.fullname" $ }}-frontend
                port:
                  number: 80
                {{- else if eq .service "api-gateway" }}
                name: {{ include "mybrew.fullname" $ }}-api-gateway
                port:
                  number: 8000
                {{- else }}
                name: {{ include "mybrew.fullname" $ }}-{{ .service }}
                port:
                  number: 8000
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
